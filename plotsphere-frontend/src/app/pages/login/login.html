
<div class="login-container">

  <div class="login-card">

    <h1>PlotSphere</h1>

    <p class="subtitle">
      Digital Land Records & Mutation System
    </p>

    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">
        Login
      </button>

      @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }
      <p class="register-link">
  Don't have an account?
  <a routerLink="/register">Register</a>
</p>

    </form>

  </div>

</div>
